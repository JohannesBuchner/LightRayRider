[build-system]
requires = ["setuptools>=42", "wheel", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "lightrayrider"
version = "2.0.7"
description = "Ray Tracing Monte Carlo photon propagator and column density calculator"
readme = "README.rst"
authors = [
    { name="Johannes Buchner", email="buchner.johannes@gmx.at" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Development Status :: 6 - Mature",
]
dependencies = [
    "numpy<2",
    "progressbar-latest",
    "matplotlib",
    "scipy",
]

[project.urls]
Repository = "https://github.com/JohannesBuchner/LightRayRider"
Homepage = "https://github.com/JohannesBuchner/LightRayRider"

[flake8]
exclude = "docs"
extend-ignore = "E501,F401,E128,E231,E124"

[tool.pycodestyle]
count = false
ignore = "W191,W291,W293,E231,E225"
max-line-length = 160
statistics = false

[tool.pytest.ini_options]
collect_ignore = "['setup.py']"
